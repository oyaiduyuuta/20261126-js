<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>C4-06 別の画像に切り変える</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>別の画像に切り変える</h1>
  <h2>ホバーして画像を変更する</h2>
  <div class="img-container">
    <img class="img-change" src="images/strawberry1.jpg" alt="">
  </div>

  <h2>サムネイル画像を大きく表示</h2>
  <div class="gallery">
    <div class="gallery-main">
      <img src="images/gallery1.jpg" alt="">
    </div>
    <ul class="gallery-thumbnail">
      <li>
        <img src="images/gallery1.jpg" alt="">
      </li>
      <li>
        <img src="images/gallery2.jpg" alt="">
      </li>
      <li>
        <img src="images/gallery3.jpg" alt="">
      </li>
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
